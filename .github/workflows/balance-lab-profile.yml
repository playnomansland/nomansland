name: Balance Lab Profile

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/engine.js'
      - 'src/game.js'
      - 'src/default-roster.json'
      - 'tools/balance-lab.js'
      - 'tools/profile-matchup-matrix.js'
      - '.github/workflows/balance-lab-profile.yml'
  workflow_dispatch:
    inputs:
      report_name:
        description: Name of the profiling report artifact
        required: true
        default: balance-lab-profile

permissions:
  contents: read

jobs:
  profile:
    name: Profile live-engine matchup matrix
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: feature/balance-lab-simulation-runner

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run real-engine profiler
        run: node tools/profile-matchup-matrix.js --out reports/balance-lab-profile.json

      - name: Upload profiling report
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.report_name }}
          path: reports/balance-lab-profile.json
          if-no-files-found: error
          retention-days: 30
