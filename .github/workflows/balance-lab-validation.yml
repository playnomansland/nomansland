name: Balance Lab validation

concurrency:
  group: balance-lab-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    paths:
      - "src/**"
      - "tools/balance-lab.js"
      - "tools/profile-matchup-matrix.js"
      - "tools/tests/balance-lab.js"
      - ".github/workflows/balance-lab-validation.yml"
      - ".github/workflows/balance-lab-profile.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run Balance Lab tests
        run: node tools/tests/balance-lab.js
      - name: Profile live-engine matchup matrix
        run: node tools/profile-matchup-matrix.js --out reports/balance-lab-profile.json
      - name: Upload profiling report
        uses: actions/upload-artifact@v4
        with:
          name: balance-lab-profile
          path: reports/balance-lab-profile.json
          if-no-files-found: error
          retention-days: 30
